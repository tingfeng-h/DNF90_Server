[service]
name = "dnfbridge"
node_id = "dnfbridge-docker-1"
environment = "local"
public_addr = "10.0.4.9:7001"
private_addr = "10.253.90.2:18111"
[cluster]
id = "local"
gid = 2
virtual_gid = 2
shard_id = 9999
zone = "local"
version = "local"
data_version = "local"
[admin]
listen = "10.253.90.2:18111"
token = "<ADMIN_TOKEN>"
[pvf]
enabled = true
path = "data/dnf/Script.pvf"
max_bytes = 536870912
preload_chunks = false
[server_group]
enabled = true
store_kind = "file"
plan_file = "configs/servergroup/plan.json"
[topology]
enabled = false
[worker]
size = 8
queue = 256
[profile_store]
store_kind = "memory"
[idempotency]
kind = "memory"
[registry]
kind = "memory"
[bus]
kind = "memory"
[cache]
kind = "memory"
[lock]
kind = "memory"
[presence]
kind = "memory"
